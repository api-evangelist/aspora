aid: aspora
name: Aspora
description: >-
  Aspora is a cross-border fintech serving the Non-Resident Indian (NRI) diaspora, offering
  money transfers from the USA, UK, and UAE to India at near-mid-market ("Google") rates, NRE/NRO
  bank account opening, and digital gold investing, with multi-currency savings, bill payments,
  and EMI/SIP automation on its roadmap. The company reports over 1 million users moving more than
  $2 billion, with proactive fraud detection, 256-bit encryption, and funds held at regulated
  institutions. Formerly known as Vance, Aspora is a consumer mobile application (iOS and Android)
  and does not publish a public developer API, SDK, or API documentation. This profile was surfaced
  as a Greylock portfolio company and enriched by the API Evangelist pipeline from Aspora's public
  web surface (identity, links, and probed domain security).
